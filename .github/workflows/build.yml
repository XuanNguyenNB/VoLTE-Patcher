name: Build và kiểm thử

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\Tests\VoLTEVendorPatcher.Tests\VoLTEVendorPatcher.Tests.csproj

      - name: Build
        run: dotnet build .\Tests\VoLTEVendorPatcher.Tests\VoLTEVendorPatcher.Tests.csproj -c Release --no-restore

      - name: Smoke test công khai
        run: dotnet run --project .\Tests\VoLTEVendorPatcher.Tests\VoLTEVendorPatcher.Tests.csproj -c Release --no-build

      - name: Publish EXE
        shell: powershell
        run: .\Build\publish.ps1 -SkipToolBootstrap

      - name: Lưu artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoLTEVendorPatcher-win-x64
          path: |
            artifacts/Release/win-x64/VoLTEVendorPatcher.exe
            artifacts/Release/win-x64/SHA256SUMS.txt
